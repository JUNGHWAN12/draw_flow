name: Deploy to GitHub Pages

# main 브랜치에 올라오면 자동으로 빌드해서 GitHub Pages에 배포한다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions"로 선택해야 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 수업 게시판 주소. 저장소 Settings → Secrets and variables → Actions → Variables 에
      # BOARD_URL 을 넣으면 [게시판에 올리기]·[게시판에 제출] 버튼이 보인다. 없으면 버튼이 숨겨진다.
      - run: npm run build
        env:
          VITE_BOARD_URL: ${{ vars.BOARD_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
